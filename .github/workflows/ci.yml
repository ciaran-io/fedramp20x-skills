name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest python-docx openpyxl jsonschema
      - name: Download the FedRAMP rules data at the pinned commit
        run: python shared/scripts/frmr.py fetch
      - name: Download the pinned FedRAMP JSON schemas
        run: python shared/scripts/fedramp_export.py fetch
      - name: Shared files are in sync
        run: python tools/sync_shared.py --check
      - name: Tests
        run: python -m pytest -q tests
      - name: Build the claude.ai zip files
        run: python tools/package_skills.py
