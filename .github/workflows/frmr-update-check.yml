name: frmr-update-check

# Once a month, compare the pinned FedRAMP rules commit in shared/scripts/frmr.py with the
# latest commit on FedRAMP/rules. If upstream has moved, open an issue (once) so the update is
# made by pull request: change COMMIT and the hashes, run the tests, review what changed.
# It also checks that each pinned FedRAMP JSON schema still has the pinned hash.

on:
  schedule:
    - cron: "23 13 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compare the pinned commit with FedRAMP/rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -oP '^COMMIT = "\K[0-9a-f]{40}' shared/scripts/frmr.py)
          latest=$(gh api repos/FedRAMP/rules/commits/HEAD --jq .sha)
          echo "pinned $pinned, latest $latest"
          if [ "$pinned" = "$latest" ]; then
            echo "FedRAMP rules data is current"
            exit 0
          fi
          title="FedRAMP rules data has a newer commit (${latest:0:7})"
          if gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An open issue already tracks ${latest:0:7}"
            exit 0
          fi
          gh issue create --title "$title" --body "FedRAMP/rules has moved from the pinned commit ${pinned:0:7} to ${latest:0:7}.

          Compare: https://github.com/FedRAMP/rules/compare/${pinned}...${latest}

          To update, on a branch:
          1. Set COMMIT in shared/scripts/frmr.py to ${latest}, delete the cached data, run python shared/scripts/frmr.py fetch, and copy the new hashes it reports into FILES.
          2. Run python tools/sync_shared.py and python -m pytest tests.
          3. Review changed rule and KSI IDs, timeframes and class variants, and update the skills' references and the examples where they cite them.
          4. Open a pull request."
      - name: Compare the pinned FedRAMP JSON schemas with fedramp.gov
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python shared/scripts/fedramp_export.py fetch; then
            echo "FedRAMP schemas match their pins"
            exit 0
          fi
          title="A pinned FedRAMP JSON schema has changed or moved"
          if gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An open issue already tracks this"
            exit 0
          fi
          gh issue create --title "$title" --body "python shared/scripts/fedramp_export.py fetch failed on $(date -u +%F). A schema at https://fedramp.gov/schemas/ no longer matches its SHA-256 in SCHEMAS, or could not be downloaded.

          To update, on a branch:
          1. Download the new schema and read it in full.
          2. Update its hash in SCHEMAS (and the dated URL if FedRAMP published a new version).
          3. Update the export blocks in the examples and the field maps in shared/references/fedramp-export.md where fields changed.
          4. Run python -m pytest tests and open a pull request."
